[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#06181D"
secondaryBackgroundColor = "#0C2830"
textColor = "#E6F2F2"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[client]
showErrorDetails = "type"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
